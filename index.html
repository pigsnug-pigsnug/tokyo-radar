<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tokyo Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Cinzel:wght@600&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
/* ── TOKENS ── */
:root{
  --bg:#FFFFFF;--panel:#F6F7F9;--paper:#FFFFFF;--ink:#0B0B0F;--muted:#5A6070;
  --line:#E2E5EB;--line2:#CBD0D9;
  --brand:#D10F22;--brand-ink:#FFFFFF;--brand-text:#C20D1F;--brand-soft:rgba(209,15,34,.08);
  --blue:#1F4FD8;--blue-soft:rgba(31,79,216,.09);
  --good:#0A9B45;--good-t:#07833A;--good-soft:rgba(10,155,69,.12);
  --bad:#E5132B;--bad-t:#D01628;--bad-soft:rgba(229,19,43,.10);
  --warn:#A86B0B;--warn-soft:rgba(168,107,11,.13);
  --rail:#0B0B0F;--rail-ink:#F2F3F6;--rail-muted:#9AA0AE;--rail-line:#23232B;--rail-on:#2B0D12;
  --shadow:0 1px 0 rgba(11,11,15,.04),0 10px 26px rgba(11,11,15,.07);
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --tab-h:48px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{cursor:pointer;font-family:inherit}
a{color:inherit}

/* ── PIN OVERLAY ── */
#pin-overlay{position:fixed;inset:0;z-index:9999;background:var(--rail);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#pin-overlay h2{font-family:var(--display);color:var(--rail-ink);font-size:28px;letter-spacing:1px}
#pin-overlay .pin-dots{display:flex;gap:12px}
#pin-overlay .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--rail-muted);background:transparent;transition:background .15s}
#pin-overlay .pin-dot.filled{background:var(--brand)}
#pin-overlay .pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;margin-top:8px}
#pin-overlay .pin-btn{width:64px;height:64px;border-radius:50%;background:var(--rail-line);color:var(--rail-ink);border:none;font-size:22px;font-family:var(--mono);transition:background .12s}
#pin-overlay .pin-btn:active{background:var(--brand)}
#pin-overlay .pin-err{color:var(--bad);font-size:13px;height:20px}

/* ── TOP TAB BAR ── */
#tab-bar{display:flex;align-items:center;background:var(--rail);height:var(--tab-h);position:sticky;top:0;z-index:100;gap:0;border-bottom:1px solid var(--rail-line)}
#tab-bar .tb-brand{padding:0 16px;font-family:'Cinzel',serif;color:var(--brand);font-size:15px;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
#tab-bar .tb-tabs{display:flex;flex:1;gap:0}
#tab-bar .tb-tab{padding:0 20px;height:var(--tab-h);border:none;background:transparent;color:var(--rail-muted);font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
#tab-bar .tb-tab:hover{color:var(--rail-ink)}
#tab-bar .tb-tab.active{color:var(--rail-ink);border-bottom-color:var(--brand)}
#tab-bar .tb-clock{padding:0 16px;font-family:var(--mono);font-size:12px;color:var(--rail-muted);white-space:nowrap;flex-shrink:0}

/* ── TAB PANELS ── */
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ════════════════════════════════════════════
   PULSE TAB
   ════════════════════════════════════════════ */
#pulse-panel{min-height:calc(100vh - var(--tab-h));background:var(--bg)}
.pulse-toolbar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pulse-toolbar .ptb-status{font-size:12px;color:var(--muted);font-family:var(--mono)}
.pulse-filter-group{display:flex;gap:6px;flex-wrap:wrap}
.pulse-filter-group button{padding:4px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--paper);color:var(--muted);font-size:12px;font-weight:500;transition:all .15s}
.pulse-filter-group button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pulse-list{max-width:820px;margin:0 auto;padding:12px 20px}
.pulse-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.pulse-item-badge{flex-shrink:0;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-family:var(--mono);white-space:nowrap}
.badge-reddit{background:#FF4500;color:#fff}
.badge-hn{background:#FF6600;color:#fff}
.badge-google{background:var(--blue);color:#fff}
.badge-devto{background:#3D3D3F;color:#fff}
.pulse-item-body{flex:1;min-width:0}
.pulse-item-title{font-size:14px;font-weight:500;line-height:1.4;margin-bottom:4px}
.pulse-item-title a{text-decoration:none;color:var(--ink)}
.pulse-item-title a:hover{color:var(--brand-text)}
.pulse-item-meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
.pulse-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.pulse-spinner{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);font-family:var(--mono);font-size:13px}

/* ════════════════════════════════════════════
   RADAR TAB
   ════════════════════════════════════════════ */
#radar-panel{min-height:calc(100vh - var(--tab-h));background:#08090A;color:#E8EAF0}
.radar-top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #1C1E26;flex-wrap:wrap}
.radar-top .rt-sol{font-family:var(--mono);font-size:13px;color:#A0A8B8}
.radar-top .rt-status{font-family:var(--mono);font-size:12px}
.radar-top .rt-status.live{color:#00E676}
.radar-top .rt-status.dead{color:#FF4444}
.radar-top .rt-count{font-family:var(--mono);font-size:12px;color:#6B7280}
.radar-top .rt-spacer{flex:1}
.radar-top .rt-btn{padding:5px 12px;border-radius:6px;border:1px solid #2A2D38;background:transparent;color:#A0A8B8;font-size:12px;cursor:pointer;font-family:var(--mono)}
.radar-top .rt-btn:hover{background:#1C1E26;color:#E8EAF0}
.radar-body{display:grid;grid-template-columns:1fr 320px;min-height:calc(100vh - var(--tab-h) - 49px)}
@media(max-width:700px){.radar-body{grid-template-columns:1fr}}
.radar-words{padding:16px 20px;overflow-y:auto}
.radar-words h3{font-family:var(--display);font-size:15px;letter-spacing:1px;color:#7B8A9C;margin-bottom:12px}
.rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.rw-chip{padding:8px 12px;border-radius:8px;border:1px solid #1C1E26;background:#0F1015;cursor:pointer;transition:all .15s}
.rw-chip:hover{border-color:#2A2D38}
.rw-chip.watch{border-color:var(--brand);background:rgba(209,15,34,.08)}
.rw-chip.hot{border-color:#FFD600;background:rgba(255,214,0,.07)}
.rw-word{font-family:var(--mono);font-size:13px;font-weight:600;color:#E8EAF0;margin-bottom:4px}
.rw-bars{display:flex;gap:4px;align-items:flex-end;height:24px;margin-bottom:4px}
.rw-bar{width:14px;border-radius:2px 2px 0 0;min-height:2px}
.rw-bar.b30{background:var(--brand)}
.rw-bar.b120{background:#5A6AFF}
.rw-bar.b360{background:#2A2D38}
.rw-nums{font-family:var(--mono);font-size:10px;color:#6B7280;display:flex;gap:6px}
.rw-speed{font-size:10px;color:#FFD600;font-family:var(--mono)}
.radar-side{border-left:1px solid #1C1E26;padding:16px}
.rs-section{margin-bottom:20px}
.rs-section h4{font-family:var(--display);font-size:13px;letter-spacing:1px;color:#7B8A9C;margin-bottom:10px}
.rs-coin-input{display:flex;gap:6px;margin-bottom:8px}
.rs-coin-input input{flex:1;background:#0F1015;border:1px solid #2A2D38;border-radius:6px;padding:6px 10px;color:#E8EAF0;font-family:var(--mono);font-size:12px;outline:none}
.rs-coin-input input:focus{border-color:var(--brand)}
.rs-coin-input button{padding:6px 10px;border-radius:6px;border:none;background:var(--brand);color:#fff;font-size:12px;font-family:var(--mono)}
#radar-coin-result{font-size:12px;font-family:var(--mono);line-height:1.6}
.radar-stream{border-top:1px solid #1C1E26;padding:10px 20px}
.radar-stream h4{font-family:var(--display);font-size:13px;letter-spacing:1px;color:#7B8A9C;margin-bottom:8px}
.stream-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
.stream-item{display:flex;gap:10px;align-items:baseline;font-size:12px;padding:3px 0;border-bottom:1px solid #0F1015}
.stream-item .si-name{font-weight:600;color:#E8EAF0;font-family:var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stream-item .si-sym{color:#6B7280;font-family:var(--mono);font-size:11px;width:60px;flex-shrink:0}
.stream-item .si-time{color:#3D4450;font-family:var(--mono);font-size:10px;flex-shrink:0}
.radar-watch-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.watch-chip{padding:3px 8px;border-radius:20px;background:rgba(209,15,34,.15);border:1px solid var(--brand);color:var(--brand);font-size:11px;font-family:var(--mono);cursor:pointer}
.watch-chip:hover{background:var(--brand);color:#fff}

/* ════════════════════════════════════════════
   DESK TAB (Tinance layout)
   ════════════════════════════════════════════ */
#desk-panel{display:none}
#desk-panel.active{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - var(--tab-h))}
.desk-rail{background:var(--rail);position:sticky;top:var(--tab-h);height:calc(100vh - var(--tab-h));display:flex;flex-direction:column;overflow:hidden}
.desk-rail-inner{flex:1;overflow-y:auto;padding:12px 0}
.desk-rail-group{margin-bottom:4px}
.desk-rail-head{padding:6px 16px 4px;font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--rail-muted);text-transform:uppercase}
.desk-nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:7px 16px;border:none;background:transparent;color:var(--rail-muted);font-size:13px;font-weight:500;text-align:left;transition:background .12s,color .12s;cursor:pointer}
.desk-nav-btn:hover{background:rgba(255,255,255,.05);color:var(--rail-ink)}
.desk-nav-btn.active{background:var(--rail-on);color:var(--rail-ink)}
.desk-nav-btn svg{flex-shrink:0;opacity:.7}
.desk-main{padding:28px 32px;overflow-y:auto;background:var(--panel)}
@media(max-width:900px){
  #desk-panel.active{grid-template-columns:1fr}
  .desk-rail{display:none}
  .desk-main{padding:16px}
}

/* ── Desk shared components ── */
.desk-page-title{font-family:var(--display);font-size:26px;font-weight:900;letter-spacing:.5px;margin-bottom:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:var(--line);background:var(--panel)}
.btn-brand{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn-brand:hover{background:var(--brand-text);border-color:var(--brand-text)}
.btn-sm{padding:5px 10px;font-size:12px}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.tag-good{background:var(--good-soft);color:var(--good-t)}
.tag-bad{background:var(--bad-soft);color:var(--bad-t)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-blue{background:var(--blue-soft);color:var(--blue)}
input[type=text],input[type=number],input[type=date],select,textarea{font-family:var(--body);font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;outline:none;width:100%;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:72px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono)}
.text-good{color:var(--good-t)}
.text-bad{color:var(--bad-t)}
.text-warn{color:var(--warn)}
.text-muted{color:var(--muted)}
.text-brand{color:var(--brand-text)}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9990;transition:transform .25s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
/* db-status */
#db-badge{padding:3px 8px;border-radius:4px;font-size:10px;font-family:var(--mono);font-weight:700;letter-spacing:.5px}
#db-badge.ok{background:var(--good-soft);color:var(--good-t)}
#db-badge.none{background:var(--warn-soft);color:var(--warn)}
</style>
</head>
<body>

<!-- ── PIN LOCK ── -->
<div id="pin-overlay">
  <h2>TOKYO RADAR</h2>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="pd0"></div>
    <div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div>
    <div class="pin-dot" id="pd3"></div>
  </div>
  <div class="pin-err" id="pin-err"></div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinKey('1')">1</button>
    <button class="pin-btn" onclick="pinKey('2')">2</button>
    <button class="pin-btn" onclick="pinKey('3')">3</button>
    <button class="pin-btn" onclick="pinKey('4')">4</button>
    <button class="pin-btn" onclick="pinKey('5')">5</button>
    <button class="pin-btn" onclick="pinKey('6')">6</button>
    <button class="pin-btn" onclick="pinKey('7')">7</button>
    <button class="pin-btn" onclick="pinKey('8')">8</button>
    <button class="pin-btn" onclick="pinKey('9')">9</button>
    <button class="pin-btn" onclick="pinKey('back')" style="font-size:16px">⌫</button>
    <button class="pin-btn" onclick="pinKey('0')">0</button>
    <button class="pin-btn" onclick="pinKey('ok')" style="background:var(--brand);color:#fff">✓</button>
  </div>
</div>

<!-- ── TAB BAR ── -->
<div id="tab-bar">
  <div class="tb-brand">⬡ TOKYO</div>
  <div class="tb-tabs">
    <button class="tb-tab active" onclick="switchTab('pulse')">Pulse</button>
    <button class="tb-tab" onclick="switchTab('radar')">Radar</button>
    <button class="tb-tab" onclick="switchTab('desk')">Desk</button>
  </div>
  <div class="tb-clock" id="ist-clock">--:--:-- IST</div>
</div>

<!-- ── PULSE PANEL ── -->
<div id="pulse-panel" class="tab-panel active">
  <div class="pulse-toolbar">
    <div class="pulse-filter-group" id="pulse-filters">
      <button class="active" onclick="setPulseFilter('all',this)">All</button>
      <button onclick="setPulseFilter('Reddit',this)">Reddit</button>
      <button onclick="setPulseFilter('Hacker News',this)">HN</button>
      <button onclick="setPulseFilter('Google Trends',this)">Trends</button>
      <button onclick="setPulseFilter('Dev.to',this)">Dev.to</button>
    </div>
    <div class="pulse-filter-group" id="pulse-time-filters">
      <button class="active" onclick="setPulseTime('all',this)">All time</button>
      <button onclick="setPulseTime('now',this)">Last 6h</button>
    </div>
    <div class="ptb-status" id="pulse-status">Loading…</div>
  </div>
  <div class="pulse-list" id="pulse-list">
    <div class="pulse-spinner">Fetching pulse data…</div>
  </div>
</div>

<!-- ── RADAR PANEL ── -->
<div id="radar-panel" class="tab-panel">
  <div class="radar-top">
    <span class="rt-sol" id="radar-sol">SOL —</span>
    <span class="rt-status dead" id="radar-status">Disconnected</span>
    <span class="rt-count" id="radar-count">0 coins</span>
    <div class="rt-spacer"></div>
    <button class="rt-btn" onclick="radarExport()">Export JSON</button>
  </div>
  <div class="radar-body">
    <div style="display:flex;flex-direction:column;min-height:0">
      <div class="radar-words">
        <h3>HOT WORDS</h3>
        <div class="rw-grid" id="rw-grid"><div style="color:#6B7280;font-family:var(--mono);font-size:12px">Connecting to Pump.fun…</div></div>
      </div>
      <div class="radar-stream">
        <h4>LIVE STREAM</h4>
        <div class="stream-list" id="radar-stream"></div>
      </div>
    </div>
    <div class="radar-side">
      <div class="rs-section">
        <h4>COIN CHECK</h4>
        <div class="rs-coin-input">
          <input type="text" id="radar-coin-q" placeholder="name / symbol / CA" onkeydown="if(event.key==='Enter')radarCoinCheck()">
          <button onclick="radarCoinCheck()">Go</button>
        </div>
        <div id="radar-coin-result" style="color:#6B7280">Enter a token to look up.</div>
      </div>
      <div class="rs-section">
        <h4>WATCH WORDS</h4>
        <div class="rs-coin-input">
          <input type="text" id="radar-watch-q" placeholder="word to track" onkeydown="if(event.key==='Enter')radarAddWatch()">
          <button onclick="radarAddWatch()">Add</button>
        </div>
        <div class="radar-watch-list" id="radar-watch-list"></div>
      </div>
      <div class="rs-section">
        <h4>LEGEND</h4>
        <div style="font-size:11px;color:#6B7280;font-family:var(--mono);line-height:1.8">
          <div><span style="color:var(--brand)">■</span> 30 min &nbsp;<span style="color:#5A6AFF">■</span> 2 h &nbsp;<span style="color:#2A2D38">■</span> 6 h</div>
          <div style="color:#FFD600">★ picking up (3× avg)</div>
          <div>Click word to watch/unwatch</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── DESK PANEL ── -->
<div id="desk-panel" class="tab-panel">
  <nav class="desk-rail">
    <div class="desk-rail-inner" id="desk-nav"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--rail-line);display:flex;align-items:center;gap:8px">
      <span id="db-badge" class="none">DB</span>
    </div>
  </nav>
  <main class="desk-main" id="desk-main"></main>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   FIREBASE CONFIG — replace with your project values
   ══════════════════════════════════════════════════════════ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAiydLJKva2ZtvJYRJdr7PNu0S3IRLiMmI",
  authDomain: "snugpig-26baf.firebaseapp.com",
  projectId: "snugpig-26baf",
  storageBucket: "snugpig-26baf.firebasestorage.app",
  messagingSenderId: "449226735757",
  appId: "1:449226735757:web:7e7071e06adf61fbab62c4"
};

/* ══════════════════════════════════════════════════════════
   PIN LOCK
   ══════════════════════════════════════════════════════════ */
var PIN_HASH = '1234'; // change to your real PIN
var pinBuf = '';
function pinKey(k){
  if(k==='back'){pinBuf=pinBuf.slice(0,-1);}
  else if(k==='ok'){pinCheck();}
  else if(pinBuf.length<4){pinBuf+=k;}
  updateDots();
  if(pinBuf.length===4)setTimeout(pinCheck,80);
}
function updateDots(){
  for(var i=0;i<4;i++){
    var d=document.getElementById('pd'+i);
    if(d) d.className='pin-dot'+(i<pinBuf.length?' filled':'');
  }
}
function pinCheck(){
  if(pinBuf===PIN_HASH){
    document.getElementById('pin-overlay').style.display='none';
    appInit();
  } else {
    document.getElementById('pin-err').textContent='Wrong PIN';
    pinBuf='';updateDots();

// Client-side Reddit fetch (browser IP, not blocked)
function pulseClientReddit(){
  var proxy='https://api.allorigins.win/get?url=';
  var feeds=['https://www.reddit.com/r/popular.json?limit=25','https://www.reddit.com/r/technology.json?limit=15','https://www.reddit.com/r/worldnews.json?limit=15'];
  var H48=48*3600*1000;
  return Promise.allSettled(feeds.map(function(u){
    return fetch(proxy+encodeURIComponent(u)).then(function(r){return r.json()}).then(function(d){
      var body=typeof d.contents==='string'?JSON.parse(d.contents):d.contents;
      return (body&&body.data&&body.data.children)||[];
    });
  })).then(function(results){
    var items=[];
    results.forEach(function(r){
      if(r.status!=='fulfilled')return;
      (r.value||[]).forEach(function(c){
        var d=c.data;if(!d||!d.title)return;
        var t=(d.created_utc||0)*1000;
        if(Date.now()-t>H48)return;
        items.push({platform:'Reddit',title:d.title,meta:'r/'+d.subreddit+' · '+(d.ups||0).toLocaleString()+' ups · '+(d.num_comments||0)+' comments',url:'https://reddit.com'+d.permalink,tags:[d.subreddit],score:(d.ups||0)+(d.num_comments||0),seenAt:t,lastSeen:Date.now()});
      });
    });
    return items;
  }).catch(function(){return[];});
}

// Client-side Google Trends fetch (browser IP, not blocked)
function pulseClientGoogleTrends(){
  var proxy='https://api.allorigins.win/get?url=';
  var url='https://trends.google.com/trends/trendingsearches/daily/rss?geo=US';
  return fetch(proxy+encodeURIComponent(url)).then(function(r){return r.json()}).then(function(d){
    var xml=d.contents||'';
    var items=[];
    var rx=/<item>([\s\S]*?)<\/item>/g;var m;
    while((m=rx.exec(xml))!==null){
      var b=m[1];
      var title=(b.match(/<title><!\[CDATA\[(.*?)\]\]>/)||b.match(/<title>(.*?)<\/title>/))?.[1]?.trim();
      var traffic=b.match(/<ht:approx_traffic>(.*?)<\/ht:approx_traffic>/)?.[1]?.trim();
      var link=b.match(/<link>(.*?)<\/link>/)?.[1]?.trim();
      var pub=b.match(/<pubDate>(.*?)<\/pubDate>/)?.[1]?.trim();
      var t=pub?new Date(pub).getTime():Date.now();
      if(title)items.push({platform:'Google Trends',title:title,meta:'~'+(traffic||'N/A')+' searches',url:link||'https://trends.google.com/trends/explore?q='+encodeURIComponent(title),tags:['trending'],score:parseInt((traffic||'0').replace(/[^0-9]/g,''))||0,seenAt:isNaN(t)?Date.now():t,lastSeen:Date.now()});
    }
    return items.slice(0,20);
  }).catch(function(){return[];});
}

function pulseFetch(){
  var el=document.getElementById('pulse-status');
  if(el)el.textContent='Refreshing…';
  // Fetch server sources (HN + Dev.to) + client-side Reddit + Google Trends in parallel
  Promise.all([
    fetch('/api/trends').then(function(r){return r.json()}).catch(function(){return{all_items:[],now_items:[],updated_at:0}}),
    pulseClientReddit(),
    pulseClientGoogleTrends()
  ]).then(function(results){
    var server=results[0];
    var reddit=results[1];
    var gtrends=results[2];
    // Merge all into pulseData
    var combined=[].concat(server.all_items||[]).concat(reddit).concat(gtrends);
    // Deduplicate by title
    var seen=new Map();
    combined.forEach(function(i){var k=(i.platform+'::'+i.title).toLowerCase();if(!seen.has(k))seen.set(k,i);});
    var all=Array.from(seen.values()).sort(function(a,b){return b.seenAt-a.seenAt});
    var H6=6*3600*1000;
    pulseData={all_items:all,now_items:all.filter(function(i){return Date.now()-i.seenAt<=H6}),updated_at:Date.now()};
    if(el)el.textContent='Updated just now · '+all.length+' items (HN+Dev+Reddit+Trends)';
    pulseRender();
  }).catch(function(e){
    if(el)el.textContent='Fetch error — retrying';
  });
}

  return '<span class="pulse-item-badge '+cls+'">'+p+'</span>';
}
function pulseRender(){
  var items=(pulseTime==='now'?pulseData.now_items:pulseData.all_items)||[];
  if(pulseFilter!=='all') items=items.filter(function(i){return i.platform===pulseFilter});
  var el=document.getElementById('pulse-list');

  el.innerHTML=items.map(function(i){
    var ago=i.seenAt?Math.round((Date.now()-i.seenAt)/60000)+'m ago':'';
    return '<div class="pulse-item">'+pulseBadge(i.platform)+'<div class="pulse-item-body"><div class="pulse-item-title"><a href="'+i.url+'" target="_blank" rel="noopener">'+escHtml(i.title)+'</a></div><div class="pulse-item-meta">'+escHtml(i.meta||'')+'&nbsp;·&nbsp;'+ago+'</div></div></div>';
  }).join('');
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function radarRender(){

function deskRefresh(){if(_view)deskRender(_view)}

function deskRenderNav(){
  var el=document.getElementById('desk-nav');if(!el)return;
  el.innerHTML=NAVG.map(function(g){
    return '<div class="desk-rail-group"><div class="desk-rail-head">'+g[0]+'</div>'+
      g[1].map(function(it){
        return '<button class="desk-nav-btn'+(it[0]===_view?' active':'')+'" onclick="deskRender(\''+it[0]+'\')">'+
          '<span>'+( ICONS[it[0]]||'·')+'</span><span>'+it[1]+'</span></button>';
      }).join('')+'</div>';
  }).join('');
}

function deskRender(v){
  _view=v;
  deskRenderNav();
  var el=document.getElementById('desk-main');if(!el)return;
  var fn=VIEWS[v];
  el.innerHTML=fn?fn():'<div class="desk-page-title">'+v+'</div><p style="color:var(--muted)">No view found.</p>';
}

var VIEWS={};

/* ── HOME (Today) ── */
VIEWS.home=function(){
  var now=istNow();var hr=istHour();
  var greeting=hr<12?'Good morning':'hr<17?\'Good afternoon\':\'Good evening\'';
  // PnL
  var totSpent=0,totEarned=0,totPresale=0,totUnfunded=0;
  data.launches.forEach(function(r){var c=launchCalc(r);totSpent+=c.spent;totEarned+=c.earned;totPresale+=c.presale;totUnfunded+=c.unfunded});
  var totNet=totEarned-totSpent;
  // bills due
  var billsAlert='';
  var due=data.infra.filter(function(r){var d=daysUntil(r.renew_date);return d!==null&&d<=7});
  if(due.length) billsAlert='<div class="card" style="border-color:var(--warn)"><div class="card-title" style="color:var(--warn)">⚠ BILLS DUE SOON</div>'+due.map(function(r){return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>'+escHtml(r.name)+'</span><span class="mono text-warn">'+usd(r.amount)+'&nbsp;in '+daysUntil(r.renew_date)+'d</span></div>'}).join('')+'</div>';
  // unfunded
  var unfundedAlert='';
  var uf=data.launches.filter(function(r){return launchCalc(r).unfunded>0});
  if(uf.length) unfundedAlert='<div class="card" style="border-color:var(--bad)"><div class="card-title" style="color:var(--bad)">⚡ UNFUNDED PRESALES</div>'+uf.map(function(r){var c=launchCalc(r);return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>'+escHtml(r.name||'Launch')+'</span><span class="mono text-bad">'+usd(c.unfunded)+' needed</span></div>'}).join('')+'</div>';
  // sources
  var src=srcSorted().slice(0,6);
  var srcHtml='<div class="card"><div class="card-title">SOURCES CHECK</div><div style="display:flex;flex-wrap:wrap;gap:8px">'+src.map(function(s){return '<a href="'+escHtml(s.url||'#')+'" target="_blank" style="padding:5px 10px;border-radius:20px;border:1px solid var(--line2);font-size:12px;text-decoration:none;color:var(--ink)">'+escHtml(s.name)+'</a>'}).join('')+(src.length===0?'<span style="color:var(--muted);font-size:13px">No sources yet.</span>':'')+'</div></div>';
  // recent launches
  var recent=data.launches.slice(0,5);
  var recentHtml='<div class="card"><div class="card-title">RECENT LAUNCHES</div>'+(recent.length?recent.map(function(r){var c=launchCalc(r);return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><span style="font-size:13px;font-weight:500">'+escHtml(r.name||'—')+'</span><span class="mono" style="font-size:12px;color:'+(c.net>=0?'var(--good-t)':'var(--bad-t)')+'">'+usd(c.net)+'</span></div>'}).join(''):'<div style="color:var(--muted);font-size:13px">No launches yet.</div>')+'</div>';
  // wallets ready
  var ready=data.wallets.filter(function(w){return w.status==='ready'});
  var wallHtml=ready.length?'<div class="card"><div class="card-title">WALLETS READY ('+ready.length+')</div>'+ready.map(function(w){return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span class="mono">'+escHtml((w.address||'').slice(0,20)+'…')+'</span><span class="mono">'+usd(w.balance)+'</span></div>'}).join('')+'</div>':'';
  return '<div class="desk-page-title">Today</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">'+
    stat('TOTAL SPENT',usd(totSpent),'bad')+stat('TOTAL EARNED',usd(totEarned),'good')+stat('NET P&L',usd(totNet),totNet>=0?'good':'bad')+stat('UNFUNDED',usd(totUnfunded),totUnfunded>0?'warn':'good')+'</div>'+
    billsAlert+unfundedAlert+srcHtml+recentHtml+wallHtml;
};
function stat(label,val,cls){return '<div class="card" style="text-align:center;padding:14px"><div class="card-title">'+label+'</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--'+cls+'-t)">'+val+'</div></div>'}
